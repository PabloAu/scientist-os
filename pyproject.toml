[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "scientist-os"
version = "0.1.0b1"
description = "A local scientific assistant with evidence-linked records, bounded agents, and human review"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Pablo Gomez Garcia"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.13,<2"]

[project.scripts]
scientist-os = "scientist_os.cli:main"
scientist-os-mcp = "scientist_os.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/scientist_os"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "examples/", "scripts/", "README.md", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md", "NOTICE", "LICENSE*", "pyproject.toml", "uv.lock", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
